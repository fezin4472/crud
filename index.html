<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>crud alpha ver 1.0</title>
</head>
<body>

    <div class="form">
        <div class="c-inputs">
            <span>marca e modelo:</span>
            <input type="text" id="input-marca-modelo" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>potênica em cavalos:</span>
            <input type="number" class="input-potencia" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>cor:</span>
            <input type="text" id="input-cor" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>ano:</span>
            <input type="number" id="input-ano" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>tabela fipe:</span>
            <input type="text" id="input-fipe" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>preço médio na olx (opcional):</span>
            <input type="text" id="input-media" placeholder="digite aqui">
        </div>

        <button>registrar</button>
    </div>

    <div id="panel">
        nada aqui
    </div>

    <script src="script.js"></script>
</body>
</html>
