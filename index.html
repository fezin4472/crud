<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>crud alpha ver 1.0</title>
</head>
<body>
    <h1>GUARDA SEUS CARROS FAVORITOS AQUI</h1>

    <div class="form">
        <div class="c-inputs">
            <span>marca:</span>
            <input type="text" id="input-marca" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>modelo:</span>
            <input type="text" id="input-modelo" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>ano:</span>
            <input type="number" id="input-ano" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>tipo:</span>
            <input type="text" id="input-tipo" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>economia (km/l):</span>
            <input type="number" id="input-economia" placeholder="digite aqui">
        </div>
        <div class="c-inputs">
            <span>placa:</span>
            <input type="text" id="input-placa" placeholder="digite aqui">
        </div>

        <button onclick="register()">registrar +</button>
    </div>

    <div class="buttons">
        <button onclick="showform()">mostrar</button>
        <button onclick="search()">pesquisar 🔍</button>
    </div>

    <div id="panel">
        nada aqui
    </div>

    <script src="script.js"></script>
</body>
</html>
